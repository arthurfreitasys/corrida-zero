<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172554">
  <meta name="description" content="Seu plano simples para começar a correr e acompanhar sua evolução.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Corrida do Zero</title>
  <style>
    :root{color-scheme:light;--bg:#f3f5fb;--surface:#fff;--ink:#17213d;--muted:#68738f;--line:#dce2ef;--blue:#2948d8;--blue-soft:#e9edff;--orange:#d94b20;--teal:#087b91;--green:#168451;--shadow:0 8px 28px #18264b0d}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding:0 16px 100px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #8da0ff;outline-offset:2px}
    .app{max-width:680px;margin:auto}.header{display:flex;align-items:center;justify-content:space-between;padding:24px 0 18px}.brand{font-size:24px;font-weight:850;letter-spacing:-.8px}.brand span{color:var(--blue)}.week-pill,.pill{border-radius:999px;background:var(--blue-soft);color:var(--blue);font-weight:750;font-size:13px;padding:6px 11px}
    .view{display:grid;gap:16px}.card,.hero{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow)}.hero{background:linear-gradient(135deg,#172554,#2948d8);color:white;border:0;padding:24px}.hero .eyebrow{color:#cbd5ff}.hero h1{font-size:38px;line-height:1.02;letter-spacing:-1.3px;margin:8px 0}.hero p{color:#e1e7ff}.eyebrow,.muted{color:var(--muted)}.eyebrow{text-transform:uppercase;font-size:12px;font-weight:800;letter-spacing:1px}.hero .muted{color:#d7defd}.hero .btn.primary{background:#fff;color:#1d36a8}
    h2{font-size:23px;letter-spacing:-.5px;margin:0 0 12px}h3{font-size:17px;margin:0 0 10px}.small{font-size:13px}.btn{border:0;border-radius:12px;padding:13px 17px;font-weight:800;min-height:46px}.btn.primary{background:var(--blue);color:#fff}.btn.secondary{background:var(--blue-soft);color:var(--blue)}.btn.outline{background:transparent;border:1px solid var(--line);color:var(--ink)}.btn.danger{color:#b52d2d;background:#fff0f0}.btn.full{width:100%}.actions{display:flex;gap:9px;flex-wrap:wrap}.actions>*{flex:1}.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{border:1px solid var(--line);border-radius:12px;padding:9px 2px;text-align:center;min-width:0}.day.today{border:2px solid var(--blue);padding:8px 1px}.day b{display:block;font-size:12px}.day span{display:block;font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}.day i{display:block;color:var(--green);font-style:normal;font-size:13px;min-height:17px}
    .progress-dots{display:flex;gap:7px}.dot{width:12px;height:12px;border:2px solid var(--line);border-radius:50%}.dot.done{background:var(--green);border-color:var(--green)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:13px;font-weight:750;color:var(--muted)}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:11px;background:#f9faff;padding:11px 12px;color:var(--ink);min-height:44px}textarea{min-height:80px;resize:vertical}.schedule-row{display:grid;grid-template-columns:105px 1fr;align-items:center;gap:12px;margin:8px 0}.schedule-row label{font-size:14px;font-weight:700}.plan-row,.log-row{padding:13px 0;border-top:1px solid var(--line)}.plan-row:first-child,.log-row:first-child{border-top:0}.plan-row{display:flex;justify-content:space-between;align-items:center;gap:12px}.plan-row strong{display:block}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{padding:14px 10px;border:1px solid var(--line);border-radius:14px;background:#fbfcff}.stat b{font-size:28px;display:block;line-height:1.1}.stat span{font-size:11px;color:var(--muted)}.log-row{display:flex;justify-content:space-between;gap:10px}.log-row strong{display:block}.log-row small{color:var(--muted)}.empty{padding:16px 0;color:var(--muted);font-size:14px}
    .tabs{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}.tabs-inner{max-width:680px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.tab{border:0;background:transparent;border-radius:12px;padding:7px 2px;color:var(--muted);font-size:12px;font-weight:750}.tab[aria-current="page"]{background:var(--blue-soft);color:var(--blue)}.tab span{display:block;font-size:19px;line-height:1.2}
    .toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#17213d;color:white;padding:11px 16px;border-radius:12px;z-index:30;box-shadow:var(--shadow);max-width:calc(100% - 32px)}.hidden{display:none!important}
    .timer-screen{position:fixed;inset:0;z-index:20;background:var(--bg);padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));display:flex;justify-content:center;overflow:auto}.timer-inner{width:100%;max-width:480px;display:flex;flex-direction:column;gap:18px}.timer-top{display:flex;justify-content:space-between;align-items:center;font-weight:750}.timer-track{height:8px;background:var(--line);border-radius:20px;overflow:hidden}.timer-track div{height:100%;width:0;background:var(--blue);transition:width .2s}.timer-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:300px}.phase{font-size:20px;font-weight:850;color:var(--phase)}.clock{font-size:clamp(68px,22vw,104px);font-weight:900;letter-spacing:-4px;line-height:1.1;font-variant-numeric:tabular-nums}.timer-hint{color:var(--muted)}.timer-screen[data-phase="run"]{--phase:var(--orange)}.timer-screen[data-phase="walk"],.timer-screen[data-phase="warm"],.timer-screen[data-phase="cool"]{--phase:var(--teal)}.timer-actions{display:grid;gap:10px}.timer-actions .pair{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    @media(min-width:600px){.hero h1{font-size:46px}.card,.hero{padding:24px}}
  </style>
</head>
<body>
  <div class="app">
    <header class="header"><div class="brand">CORRIDA <span>DO ZERO</span></div><div class="week-pill" id="weekBadge">Semana 1</div></header>
    <main id="appView" class="view" aria-live="polite"></main>
  </div>
  <nav class="tabs" aria-label="Navegação principal"><div class="tabs-inner">
    <button class="tab" data-tab="today"><span>◷</span>Hoje</button><button class="tab" data-tab="plan"><span>▦</span>Plano</button><button class="tab" data-tab="history"><span>☷</span>Registros</button><button class="tab" data-tab="progress"><span>↗</span>Progresso</button>
  </div></nav>
  <section id="timerScreen" class="timer-screen hidden" aria-label="Temporizador"></section>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
(() => {
  'use strict';
  const STORAGE_KEY = 'corrida-zero-data-v2';
  const DAYS = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  const SHORT_DAYS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const ACTIVITIES = ['Push','Pull','Leg','Full body','Corrida','Basquete','Descanso'];
  const PLAN = [null,
    {run:1,walk:2,reps:8},{run:1,walk:2,reps:8},
    {run:2,walk:2,reps:6},{run:2,walk:2,reps:6},
    {run:4,walk:1,reps:5},{run:4,walk:1,reps:5},
    {run:9,walk:1,reps:3},{run:9,walk:1,reps:3},{continuous:30}
  ];
  const DEFAULT = {week:1,cycle:1,schedule:{0:'Corrida',1:'Push',2:'Pull',3:'Leg',4:'Descanso',5:'Descanso',6:'Corrida'},logs:[],tests:[]};
  const $ = (selector, root=document) => root.querySelector(selector);
  const clone = value => JSON.parse(JSON.stringify(value));
  const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pad = n => String(n).padStart(2,'0');
  const dateKey = date => `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`;
  const parseDate = value => { const [y,m,d] = String(value).split('-').map(Number); return new Date(y,m-1,d); };
  const formatDate = value => { const d=parseDate(value); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`; };
  const todayKey = () => dateKey(new Date());
  const weekStart = date => { const d=new Date(date.getFullYear(),date.getMonth(),date.getDate()); d.setDate(d.getDate()-(d.getDay()+6)%7); return d; };
  const durationText = seconds => `${pad(Math.floor(Math.max(0,seconds)/60))}:${pad(Math.floor(Math.max(0,seconds)%60))}`;
  const planFor = week => PLAN[Math.min(9,Math.max(1,Number(week)||1))];
  const weekTitle = week => week >= 9 ? 'Semana 9 · corrida contínua' : `Semana ${week} de 8`;
  const workoutText = week => { const p=planFor(week); return p.continuous ? `${p.continuous} min de corrida contínua` : `${p.reps} × (${p.run} min correndo + ${p.walk} min caminhando)`; };
  const phasesFor = week => {
    const p=planFor(week), phases=[{key:'warm',name:'Aquecimento',hint:'Caminhe em ritmo confortável',seconds:300}];
    if(p.continuous) phases.push({key:'run',name:'Corrida contínua',hint:'Mantenha um ritmo em que consiga conversar',seconds:p.continuous*60});
    else for(let i=0;i<p.reps;i++){ phases.push({key:'run',name:'Corra',hint:`Bloco ${i+1} de ${p.reps}`,seconds:p.run*60}); phases.push({key:'walk',name:'Caminhe',hint:`Recupere o fôlego · bloco ${i+1}`,seconds:p.walk*60}); }
    phases.push({key:'cool',name:'Desaquecimento',hint:'Caminhe devagar',seconds:300}); return phases;
  };
  const totalMinutes = week => Math.round(phasesFor(week).reduce((sum,p)=>sum+p.seconds,0)/60);
  function normalizeState(raw){
    const s={...clone(DEFAULT),...(raw&&typeof raw==='object'?raw:{})};
    s.week=Math.min(9,Math.max(1,Math.floor(Number(s.week)||1)));
    s.cycle=Math.max(1,Math.floor(Number(s.cycle)||1));
    s.schedule={...DEFAULT.schedule,...(s.schedule&&typeof s.schedule==='object'?s.schedule:{})};
    for(let d=0;d<7;d++) if(!ACTIVITIES.includes(s.schedule[d])) s.schedule[d]=DEFAULT.schedule[d];
    s.logs=Array.isArray(s.logs)?s.logs.filter(x=>x&&typeof x==='object'&&typeof x.date==='string'&&Number(x.min)>0).map(x=>({...x,min:Number(x.min),effort:Math.min(10,Math.max(1,Number(x.effort)||5))})):[];
    s.tests=Array.isArray(s.tests)?s.tests.filter(x=>x&&typeof x.date==='string'&&Number(x.dist)>0).map(x=>({...x,dist:Number(x.dist)})):[];
    return s;
  }
  function loadState(){try{const current=localStorage.getItem(STORAGE_KEY);if(current)return normalizeState(JSON.parse(current));const legacy=localStorage.getItem('corrida-do-zero-v1');if(legacy){const migrated=normalizeState(JSON.parse(legacy));localStorage.setItem(STORAGE_KEY,JSON.stringify(migrated));return migrated;}return clone(DEFAULT);}catch(error){console.warn('Dados locais inválidos; iniciando com dados padrão.',error);return clone(DEFAULT);}}
  let state=loadState(), currentTab='today', timer=null, toastTimeout=null;
  const saveState=()=>{try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){notify('Não foi possível salvar. Verifique o espaço do navegador.');}};
  function notify(message){const el=$('#toast');el.textContent=message;el.classList.remove('hidden');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.classList.add('hidden'),2600);}
  const logsThisCycle=()=>state.logs.filter(x=>x.type==='Corrida'&&Number(x.cycle)===state.cycle).length;
  const button=(label,action,kind='primary',extra='')=>`<button class="btn ${kind} ${extra}" data-action="${action}">${label}</button>`;
  function weekCalendar(){
    const start=weekStart(new Date());
    return `<div class="week-grid">${Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);const key=dateKey(d),act=state.schedule[d.getDay()]||'Descanso';const done=state.logs.some(l=>l.date===key);return `<div class="day ${key===todayKey()?'today':''}"><b>${SHORT_DAYS[d.getDay()]}</b><span>${escapeHTML(act==='Full body'?'Full':act)}</span><i>${done?'✓':''}</i></div>`;}).join('')}</div>`;
  }
  function renderToday(){
    const now=new Date(), activity=state.schedule[now.getDay()]||'Descanso', count=logsThisCycle(), canAdvance=count>=2;
    let hero;
    if(activity==='Corrida') hero=`<section class="hero"><div class="eyebrow">${DAYS[now.getDay()]}, ${pad(now.getDate())}/${pad(now.getMonth()+1)}</div><h1>Hoje é dia de correr.</h1><p>${workoutText(state.week)} · aproximadamente ${totalMinutes(state.week)} minutos com aquecimento e desaquecimento.</p><button class="btn primary full" data-action="start-timer">Começar treino</button></section>`;
    else hero=`<section class="hero"><div class="eyebrow">${DAYS[now.getDay()]}, ${pad(now.getDate())}/${pad(now.getMonth()+1)}</div><h1>${activity==='Descanso'?'Dia de recuperar.':'Seu treino de hoje.'}</h1><p>${activity==='Descanso'?'Recuperação também faz parte do progresso. Se estiver bem, você pode iniciar uma sessão de corrida.':`Atividade programada: ${escapeHTML(activity)}. Registre quando terminar.`}</p><div class="actions">${activity!=='Descanso'?`<button class="btn primary" data-action="quick-log" data-type="${escapeHTML(activity)}">Registrar atividade</button>`:''}${button('Iniciar corrida','start-timer','outline')}</div></section>`;
    return `${hero}<section class="card"><div class="section-head"><h2>Sua semana</h2><span class="pill">${count}/2 corridas</span></div>${weekCalendar()}</section><section class="card"><div class="section-head"><h2>${weekTitle(state.week)}</h2><div class="progress-dots">${[0,1].map(i=>`<i class="dot ${i<count?'done':''}"></i>`).join('')}</div></div><p class="muted small">Faça duas sessões por semana. Repita a semana se o treino estiver difícil ou se sentir dor.</p>${canAdvance?`<div class="actions">${button(state.week<9?`Avançar para semana ${state.week+1}`:'Continuar na semana 9','advance')}${button('Repetir semana','repeat','outline')}</div>`:''}</section>`;
  }
  function renderPlan(){
    const schedule=Array.from({length:7},(_,i)=>{const day=(i+1)%7;return `<div class="schedule-row"><label for="day-${day}">${DAYS[day]}</label><select id="day-${day}" data-schedule="${day}">${ACTIVITIES.map(a=>`<option ${state.schedule[day]===a?'selected':''}>${a}</option>`).join('')}</select></div>`;}).join('');
    const weeks=Array.from({length:9},(_,i)=>i+1).map(w=>`<div class="plan-row"><div><strong>${w===9?'Semana 9 em diante':`Semana ${w}`}</strong><span class="muted small">${workoutText(w)} · ${totalMinutes(w)} min</span></div>${w===state.week?'<span class="pill">Atual</span>':`<button class="btn outline" data-action="select-week" data-week="${w}">Selecionar</button>`}</div>`).join('');
    return `<section class="card"><h2>Organize sua semana</h2><p class="muted small">Escolha a atividade de cada dia. Essas opções aparecem na tela Hoje.</p>${schedule}</section><section class="card"><h2>Plano para começar a correr</h2><p class="muted small">Comece devagar. Cada sessão tem 5 minutos de aquecimento e 5 minutos de desaquecimento. O plano sugere duas corridas por semana.</p>${weeks}</section>`;
  }
  function renderHistory(){
    const rows=state.logs.slice().sort((a,b)=>b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id))).map(log=>`<div class="log-row"><div><strong>${escapeHTML(log.type)} · ${log.min} min</strong><small>${formatDate(log.date)}${log.detail?' · '+escapeHTML(log.detail):''}</small>${log.note?`<small>${escapeHTML(log.note)}</small>`:''}</div><div><span class="pill">Esforço ${log.effort}/10</span><button class="btn danger" data-action="delete-log" data-id="${escapeHTML(log.id)}" aria-label="Excluir registro">Excluir</button></div></div>`).join('');
    return `<section class="card"><div class="section-head"><h2>Seus registros</h2>${button('Adicionar','show-log-form','secondary')}</div><div id="logForm" class="hidden"><div class="field"><label for="logType">Atividade</label><select id="logType">${ACTIVITIES.filter(a=>a!=='Descanso').map(a=>`<option>${a}</option>`).join('')}</select></div><div class="field"><label for="logDate">Data</label><input id="logDate" type="date" value="${todayKey()}"></div><div class="field"><label for="logMinutes">Duração em minutos</label><input id="logMinutes" type="number" min="1" max="600" placeholder="30"></div><div class="field"><label for="logEffort">Esforço (1 a 10)</label><input id="logEffort" type="number" min="1" max="10" value="5"></div><div class="field"><label for="logDetail">Detalhes (opcional)</label><input id="logDetail" maxlength="100" placeholder="Ex.: corrida no parque"></div><div class="field"><label for="logNote">Observações (opcional)</label><textarea id="logNote" maxlength="500" placeholder="Como foi o treino?"></textarea></div><div class="actions">${button('Salvar registro','save-log')}${button('Cancelar','hide-log-form','outline')}</div></div>${rows||'<p class="empty">Nenhum treino registrado ainda. Inicie uma corrida ou adicione seu primeiro registro.</p>'}</section>`;
  }
  function renderProgress(){
    const runs=state.logs.filter(l=>l.type==='Corrida'),minutes=runs.reduce((s,l)=>s+l.min,0),total=state.logs.length;
    const tests=state.tests.slice().sort((a,b)=>a.date.localeCompare(b.date));
    const testRows=tests.slice().reverse().map(t=>`<div class="log-row"><strong>${t.dist.toFixed(2)} km</strong><small>${formatDate(t.date)} · esforço ${t.effort||5}/10</small></div>`).join('');
    const max=Math.max(1,...runs.map(l=>l.min));
    const bars=runs.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(-8).map(l=>`<div style="display:grid;grid-template-columns:75px 1fr 35px;gap:8px;align-items:center;margin:10px 0"><small>${formatDate(l.date).slice(0,5)}</small><div style="height:10px;background:#e9edff;border-radius:20px;overflow:hidden"><div style="height:100%;width:${Math.max(3,l.min/max*100)}%;background:#2948d8;border-radius:20px"></div></div><small>${l.min}m</small></div>`).join('');
    return `<div class="stats"><div class="stat"><b>${runs.length}</b><span>Corridas</span></div><div class="stat"><b>${minutes}</b><span>Minutos de corrida</span></div><div class="stat"><b>${total}</b><span>Atividades</span></div></div><section class="card"><h2>Tempo das últimas corridas</h2>${bars||'<p class="empty">Seu gráfico aparecerá quando você registrar corridas.</p>'}</section><section class="card"><h2>Teste de distância</h2><p class="muted small">Se quiser acompanhar a evolução, registre a distância percorrida em um teste feito sempre em condições parecidas. Não precisa fazer isso toda semana.</p><div class="field"><label for="testDistance">Distância em km</label><input id="testDistance" type="number" min="0.01" step="0.01" placeholder="Ex.: 2.40"></div><div class="field"><label for="testEffort">Esforço (1 a 10)</label><input id="testEffort" type="number" min="1" max="10" value="5"></div>${button('Salvar teste','save-test')}${testRows||'<p class="empty">Nenhum teste registrado.</p>'}</section><section class="card"><h2>Seus dados</h2><p class="muted small">Faça uma cópia dos seus registros ou restaure um backup anterior.</p><div class="actions">${button('Exportar backup','export-backup','secondary')}${button('Importar backup','import-backup','outline')}</div><input id="backupFile" type="file" accept="application/json,.json" class="hidden"></section>`;
  }
  function render(){
    $('#weekBadge').textContent=weekTitle(state.week);
    const views={today:renderToday,plan:renderPlan,history:renderHistory,progress:renderProgress};
    $('#appView').innerHTML=views[currentTab]();
    document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===currentTab?'page':'false'));
  }
  function switchTab(tab){if(!['today','plan','history','progress'].includes(tab))return;currentTab=tab;render();window.scrollTo({top:0,behavior:'instant'});}
  function addLog(data){state.logs.push({id:`${Date.now()}-${Math.random().toString(36).slice(2,7)}`,cycle:state.cycle,week:state.week,...data});saveState();}

  // Temporizador: usa o relógio real, então não perde a contagem se o navegador atrasar um intervalo.
  function startTimer(){const phases=phasesFor(state.week);timer={phases,index:0,remaining:phases[0].seconds,endsAt:Date.now()+phases[0].seconds*1000,paused:false,doneSeconds:0,week:state.week,interval:null,finished:false};showTimer();timer.interval=setInterval(updateTimer,250);}
  function timerElapsed(){if(!timer)return 0;const current=timer.paused?timer.remaining:Math.max(0,(timer.endsAt-Date.now())/1000);return timer.doneSeconds+timer.phases[timer.index].seconds-current;}
  function showTimer(){const el=$('#timerScreen');el.classList.remove('hidden');document.body.style.overflow='hidden';drawTimer();}
  function drawTimer(){
    if(!timer)return;const el=$('#timerScreen');
    if(timer.finished){const mins=Math.max(1,Math.round(timer.doneSeconds/60));el.dataset.phase='cool';el.innerHTML=`<div class="timer-inner"><div><div class="eyebrow">Treino finalizado</div><h1>${timer.natural?'Boa! Você concluiu.':'Treino encerrado.'}</h1><p class="muted">${mins} minutos registrados na sessão. Salve os detalhes para acompanhar sua evolução.</p></div><div class="field"><label for="timerEffort">Esforço (1 a 10)</label><input id="timerEffort" type="number" min="1" max="10" value="5"></div><div class="field"><label for="timerNote">Observações (opcional)</label><textarea id="timerNote" maxlength="500" placeholder="Como você se sentiu?"></textarea></div><div class="timer-actions">${button('Salvar treino','save-timer')}${button('Descartar','close-timer','outline')}</div></div>`;return;}
    const phase=timer.phases[timer.index],next=timer.phases[timer.index+1];el.dataset.phase=phase.key;
    el.innerHTML=`<div class="timer-inner"><div class="timer-top"><span>${weekTitle(timer.week)}</span><button class="btn outline" data-action="close-timer">Sair</button></div><div class="timer-track"><div id="timerBar"></div></div><div class="timer-center"><div class="phase">${phase.name}</div><div class="clock" id="timerClock">${durationText(timer.remaining)}</div><div class="timer-hint">${phase.hint}</div><p class="muted small">${next?`Depois: ${next.name.toLowerCase()}`:'Última etapa'}</p></div><div class="timer-actions">${button(timer.paused?'Retomar':'Pausar','pause-timer') }<div class="pair">${button('Pular etapa','skip-phase','outline')}${button('Encerrar','end-timer','outline')}</div></div></div>`;
    updateTimer();
  }
  function updateTimer(){
    if(!timer||timer.finished||timer.paused)return;
    let now=Date.now(),phaseChanged=false;
    while(timer&&now>=timer.endsAt){timer.doneSeconds+=timer.phases[timer.index].seconds;if(timer.index>=timer.phases.length-1){finishTimer(true);return;}timer.index++;timer.endsAt+=timer.phases[timer.index].seconds*1000;phaseChanged=true;}
    if(phaseChanged){drawTimer();return;}
    const phase=timer.phases[timer.index],left=Math.max(0,(timer.endsAt-Date.now())/1000),elapsed=timerElapsed(),total=timer.phases.reduce((s,p)=>s+p.seconds,0);
    const clock=$('#timerClock'),bar=$('#timerBar');if(clock)clock.textContent=durationText(left);if(bar)bar.style.width=`${Math.min(100,elapsed/total*100)}%`;
  }
  function finishTimer(natural){if(!timer)return;if(!natural)timer.doneSeconds=timerElapsed();timer.finished=true;timer.natural=natural;clearInterval(timer.interval);timer.interval=null;drawTimer();}
  function closeTimer(){if(timer?.interval)clearInterval(timer.interval);timer=null;$('#timerScreen').classList.add('hidden');document.body.style.overflow='';}
  function pauseTimer(){if(!timer||timer.finished)return;if(timer.paused){timer.paused=false;timer.endsAt=Date.now()+timer.remaining*1000;timer.interval=setInterval(updateTimer,250);}else{timer.remaining=Math.max(0,(timer.endsAt-Date.now())/1000);timer.paused=true;clearInterval(timer.interval);timer.interval=null;}drawTimer();}
  function skipPhase(){if(!timer||timer.finished)return;const left=timer.paused?timer.remaining:Math.max(0,(timer.endsAt-Date.now())/1000);timer.doneSeconds+=timer.phases[timer.index].seconds-left;if(timer.index>=timer.phases.length-1){finishTimer(false);return;}timer.index++;timer.remaining=timer.phases[timer.index].seconds;timer.paused=false;timer.endsAt=Date.now()+timer.remaining*1000;if(!timer.interval)timer.interval=setInterval(updateTimer,250);drawTimer();}

  document.addEventListener('click',async event=>{
    const tab=event.target.closest('[data-tab]');if(tab){switchTab(tab.dataset.tab);return;}
    const target=event.target.closest('[data-action]');if(!target)return;const action=target.dataset.action;
    if(action==='start-timer')startTimer();
    else if(action==='pause-timer')pauseTimer();
    else if(action==='skip-phase')skipPhase();
    else if(action==='end-timer'){if(timer&&!timer.finished){timer.remaining=Math.max(0,(timer.endsAt-Date.now())/1000);timer.paused=true;finishTimer(false);}}
    else if(action==='close-timer')closeTimer();
    else if(action==='save-timer'){const effort=Math.min(10,Math.max(1,Number($('#timerEffort').value)||5));addLog({date:todayKey(),type:'Corrida',detail:`Plano ${weekTitle(timer.week)}`,min:Math.max(1,Math.round(timer.doneSeconds/60)),effort,note:$('#timerNote').value.trim()});closeTimer();render();notify('Treino salvo com sucesso.');}
    else if(action==='quick-log'){switchTab('history');$('#logForm').classList.remove('hidden');$('#logType').value=ACTIVITIES.includes(target.dataset.type)&&target.dataset.type!=='Descanso'?target.dataset.type:'Corrida';}
    else if(action==='show-log-form')$('#logForm').classList.remove('hidden');
    else if(action==='hide-log-form')$('#logForm').classList.add('hidden');
    else if(action==='save-log'){
      const min=Number($('#logMinutes').value),date=$('#logDate').value,effort=Number($('#logEffort').value)||5;
      if(!(min>0&&min<=600)){notify('Informe uma duração entre 1 e 600 minutos.');return;}if(!date){notify('Escolha a data do treino.');return;}
      addLog({date,type:$('#logType').value,min:Math.round(min),effort:Math.min(10,Math.max(1,effort)),detail:$('#logDetail').value.trim(),note:$('#logNote').value.trim()});render();notify('Registro adicionado.');
    }
    else if(action==='delete-log'){if(!confirm('Excluir este registro?'))return;state.logs=state.logs.filter(l=>l.id!==target.dataset.id);saveState();render();notify('Registro excluído.');}
    else if(action==='advance'){if(logsThisCycle()<2){notify('Registre duas corridas antes de avançar.');return;}state.week=Math.min(9,state.week+1);state.cycle++;saveState();render();notify(`Semana ${state.week} selecionada.`);}
    else if(action==='repeat'){state.cycle++;saveState();render();notify('Você vai repetir esta semana.');}
    else if(action==='select-week'){state.week=Math.min(9,Math.max(1,Number(target.dataset.week)||1));state.cycle++;saveState();render();notify(`Semana ${state.week} selecionada.`);}
    else if(action==='save-test'){const dist=Number($('#testDistance').value),effort=Math.min(10,Math.max(1,Number($('#testEffort').value)||5));if(!(dist>0&&dist<500)){notify('Informe uma distância válida em km.');return;}state.tests.push({date:todayKey(),dist,effort});saveState();render();notify('Teste salvo.');}
    else if(action==='export-backup'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`corrida-do-zero-backup-${todayKey()}.json`;a.click();URL.revokeObjectURL(url);notify('Backup exportado.');}
    else if(action==='import-backup')$('#backupFile').click();
  });
  document.addEventListener('change',event=>{
    const el=event.target;
    if(el.matches('[data-schedule]')){state.schedule[el.dataset.schedule]=el.value;saveState();notify('Agenda atualizada.');}
    if(el.id==='backupFile'&&el.files?.[0]){const file=el.files[0],reader=new FileReader();reader.onload=()=>{try{const imported=normalizeState(JSON.parse(reader.result));if(!confirm('Substituir os dados atuais pelo backup selecionado?'))return;state=imported;saveState();render();notify('Backup restaurado.');}catch(e){notify('Arquivo de backup inválido.');}};reader.readAsText(file);el.value='';}
  });
  window.addEventListener('error',event=>{console.error(event.error||event.message);});
  render();
})();
</script>
<script>
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(error => console.warn('PWA indisponível:', error)));
  }
</script>
